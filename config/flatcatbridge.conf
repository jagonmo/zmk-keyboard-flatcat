# =============================================================================
# FlatCat receiver dongle (shield: flatcatbridge)
# =============================================================================
# A Bluetooth-to-USB receiver for the FlatCat keyboard. It is NOT a Bluetooth
# keyboard, so ZMK's own Bluetooth is off; the bridge module runs the radio.

CONFIG_ZMK_BLE=n
CONFIG_ZMK_BT_BRIDGE=y

# HID options must match the keyboard's (flatcat.conf) so the reports line up.
# The keyboard sets only this one; everything else is the ZMK default on both.
CONFIG_ZMK_HID_INDICATORS=y

# Windows Dynamic Lighting: LampArray on this USB port, colours sent to the
# keyboard (which needs CONFIG_RGB_PRO_LAMP_ARRAY_REMOTE=y). The count goes with
# the option, never alone.
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_BT_BRIDGE_LAMP_ARRAY=y

# First pairing: first HID device whose name starts with this. After pairing the
# bonded keyboard is used. Uncomment to pin one device by address instead.
CONFIG_ZMK_BT_BRIDGE_PEER_NAME="FlatCat"
#CONFIG_ZMK_BT_BRIDGE_PEER_ADDR="AA:BB:CC:DD:EE:FF"
