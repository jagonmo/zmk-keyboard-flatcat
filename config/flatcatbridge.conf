# =============================================================================
# FlatCat receiver dongle (shield: flatcatbridge)
# =============================================================================
# A Bluetooth-to-USB receiver for the FlatCat keyboard. It is NOT a Bluetooth
# keyboard, so ZMK's own Bluetooth is off; the bridge module runs the radio.

CONFIG_ZMK_BLE=n
CONFIG_ZMK_BT_BRIDGE=y

# HID options must match the keyboard's (flatcat.conf) so the reports line up:
# these two below, everything else is the ZMK default on both.
CONFIG_ZMK_HID_INDICATORS=y
# Full N-key rollover (standard range: up to keypad "=", F13-F24 not included).
# Must match on keyboard and dongle: the dongle copies the report as-is.
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# Boot protocol: BIOS/UEFI setup screens get a plain 6-key keyboard
# (USB only; Windows and Linux keep NKRO).
CONFIG_ZMK_USB_BOOT=y

# Windows Dynamic Lighting: LampArray on this USB port, colours sent to the
# keyboard (which needs CONFIG_RGB_PRO_LAMP_ARRAY_REMOTE=y). The count goes with
# the option, never alone.
CONFIG_USB_HID_DEVICE_COUNT=2
CONFIG_ZMK_BT_BRIDGE_LAMP_ARRAY=y

# Throughput for the lamp frames. The link already negotiates 69-byte packets
# (data length) and 2M PHY, but by default the host cut every write into 27-byte
# pieces and kept only 3 in flight: about one write per connection event, ~13
# frames a second. 69 = one 19-lamp write (65 bytes) + 4 bytes of L2CAP header,
# so a write goes out as a single packet; 10 lets several go in one event. The
# ATT, L2CAP and connection TX counts follow this value by default.
CONFIG_BT_BUF_ACL_TX_SIZE=69
CONFIG_BT_BUF_ACL_TX_COUNT=10
# Zephyr requires more HCI event buffers than TX buffers (one "packets
# completed" event per buffer).
CONFIG_BT_BUF_EVT_RX_COUNT=12

# First pairing: first HID device whose name starts with this. After pairing the
# bonded keyboard is used. Uncomment to pin one device by address instead.
CONFIG_ZMK_BT_BRIDGE_PEER_NAME="FlatCat"
#CONFIG_ZMK_BT_BRIDGE_PEER_ADDR="AA:BB:CC:DD:EE:FF"
