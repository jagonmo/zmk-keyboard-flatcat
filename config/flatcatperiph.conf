# =============================================================================
# FlatCat as a peripheral of the dongle (shield: flatcatperiph)
# =============================================================================
# Not a copy-everything of flatcat.conf: that file is only valid for the
# standalone keyboard. Still left out, and why:
#   - RGB_PRO_LAMP_ARRAY + USB_HID_DEVICE_COUNT   host-facing USB HID; the host talks to the dongle
#   - STATUS and BATTERY overlays   shown on the LOWER layer / BT state, which only the
#     dongle knows (the split link does not carry layer or BT state)
#   - ZMK_STUDIO                  lives on the central

# --- Split link ---
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# --- Per-key RGB (zmk-pro-rgb module) ---
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_RGB_PRO=y

CONFIG_RGB_PRO_NUM_KEYS=79
CONFIG_RGB_PRO_MATRIX_ROWS=6
CONFIG_RGB_PRO_MATRIX_COLS=14

CONFIG_RGB_PRO_START_ON=y
CONFIG_RGB_PRO_BRT_START=20
CONFIG_RGB_PRO_SPEED_START=2

# Only keyboard part behind the dongle: allows random effect on wake again.
CONFIG_RGB_PRO_DONGLE_PERIPHERAL=y
CONFIG_RGB_PRO_RANDOM_ON_WAKE=y

# Caps lock: state forwarded by the dongle (needs the same two options there).
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y
CONFIG_RGB_PRO_CAPS_INDICATOR=y
CONFIG_RGB_PRO_CAPS_KEY=42
CONFIG_RGB_PRO_CAPS_R=157
CONFIG_RGB_PRO_CAPS_G=0
CONFIG_RGB_PRO_CAPS_B=255
CONFIG_RGB_PRO_CAPS_STYLE_DOUBLE=y

CONFIG_LED_STRIP=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# --- Bluetooth ---
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Power ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000000
CONFIG_ZMK_EXT_POWER=y
