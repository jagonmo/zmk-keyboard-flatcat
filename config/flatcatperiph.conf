# =============================================================================
# FlatCat as a peripheral of the dongle (shield: flatcatperiph)
# =============================================================================
# Not a copy-everything of flatcat.conf: that file is only valid for the
# standalone keyboard. What is left out here, and why:
#   - RGB_PRO_RANDOM_ON_WAKE      depends on !ZMK_SPLIT (unmet dependency = build error)
#   - RGB_PRO_LAMP_ARRAY + USB_HID_DEVICE_COUNT   host-facing USB HID; the host talks to the dongle
#   - ZMK_HID_INDICATORS, caps / status / battery overlays   need central state
#     (host indicators, active layer, output, BT profile) that a peripheral
#     does not have. Phase 2.
#   - ZMK_STUDIO                  lives on the central

# --- Split link ---
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# --- Per-key RGB (zmk-pro-rgb module) ---
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_RGB_PRO=y

CONFIG_RGB_PRO_NUM_KEYS=79
CONFIG_RGB_PRO_MATRIX_ROWS=6
CONFIG_RGB_PRO_MATRIX_COLS=14

CONFIG_RGB_PRO_START_ON=y
CONFIG_RGB_PRO_BRT_START=20
CONFIG_RGB_PRO_SPEED_START=2

CONFIG_LED_STRIP=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# --- Bluetooth ---
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Power ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000000
CONFIG_ZMK_EXT_POWER=y
