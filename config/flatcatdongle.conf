# =============================================================================
# FlatCat dongle (shield: flatcatdongle) — central, USB-powered, no keys
# =============================================================================
# Deliberately minimal for the first build: no RGB, no sleep, no battery.
# Role, name and connection counts are set in the shield's Kconfig.defconfig.

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- ZMK Studio (live keymap editing over USB) ---
#CONFIG_ZMK_STUDIO=y

# --- Debug (uncomment to enable USB serial logging) ---
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
