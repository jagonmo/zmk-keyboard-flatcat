# =============================================================================
# FlatCat dongle (shield: flatcatdongle) — central, USB-powered, no keys
# =============================================================================
# No LEDs, no sleep, no battery. Role, name and connection counts are set in the
# shield's Kconfig.defconfig.

# --- Lighting: commands from &rgb_pro keys are forwarded to the keyboard ---
CONFIG_RGB_PRO_FORWARD_ONLY=y

# Send the active layer and the dongle's BT/output state to the keyboard, for
# its status and battery overlays (on by default; here to make it explicit).
CONFIG_RGB_PRO_FORWARD_SYNC=y

# --- Host indicators (caps lock) forwarded to the keyboard ---
# Must also be set on the keyboard (flatcatperiph.conf).
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- ZMK Studio (live keymap editing over USB) ---
#CONFIG_ZMK_STUDIO=y

# --- Debug (uncomment to enable USB serial logging) ---
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
