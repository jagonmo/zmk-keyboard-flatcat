# Right half — peripheral. Runs effects only; no host link, no overlays.
# Effect, hue, brightness and speed arrive from the central because the
# &rgb_pro behaviour is declared BEHAVIOR_LOCALITY_GLOBAL.

# Never idle this half.
#
# Each half tracks activity on its own, so typing only on the left lets the
# right go idle and blank its strip. Effect changes made while it sleeps are
# never delivered — behaviour forwarding only happens on a key press — so it
# would wake showing a stale pattern. Staying awake keeps both halves in step,
# at the cost of battery on this side.
CONFIG_RGB_PRO_AUTO_OFF_IDLE=n
CONFIG_ZMK_IDLE_TIMEOUT=600000

# Key positions arrive in whole-keyboard numbering. This half's keys start
# at 79, so shift them back to 0-78 to index its own LED tables.
# Only 39 of those positions are wired in the keymap; the rest of the strip
# still animates, it just never fires a reactive event.
CONFIG_RGB_PRO_POSITION_OFFSET=79

