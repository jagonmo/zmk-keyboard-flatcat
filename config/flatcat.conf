# =============================================================================
# FlatCat Keyboard Configuration
# =============================================================================

# ZMK Pro RGB module 
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_RGB_PRO=y

# Matrix geometry
CONFIG_RGB_PRO_NUM_KEYS=79
CONFIG_RGB_PRO_MATRIX_ROWS=6
CONFIG_RGB_PRO_MATRIX_COLS=14

# Startup defaults
CONFIG_RGB_PRO_START_ON=y
CONFIG_RGB_PRO_BRT_START=20

# HID indicators (required for caps-lock overlay)
CONFIG_ZMK_HID_INDICATORS=y

# Caps-lock indicator
CONFIG_RGB_PRO_CAPS_INDICATOR=y
CONFIG_RGB_PRO_CAPS_LED=49
CONFIG_RGB_PRO_CAPS_R=160
CONFIG_RGB_PRO_CAPS_G=32
CONFIG_RGB_PRO_CAPS_B=240
CONFIG_RGB_PRO_CAPS_BLINK_MS=750

# LED strip driver
CONFIG_LED_STRIP=y

# GPIO regulator for WS2812 power (P0.29)
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# Bluetooth 
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Power 
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_IDLE_TIMEOUT=300000
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_EXT_POWER=y

# Debug (uncomment to enable) 
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
