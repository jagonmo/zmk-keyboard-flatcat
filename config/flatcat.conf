# =============================================================================
# FlatCat — user configuration
# =============================================================================

# --- Per-key RGB (zmk-pro-rgb module) ---
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_RGB_PRO=y

CONFIG_RGB_PRO_NUM_KEYS=79
CONFIG_RGB_PRO_MATRIX_ROWS=6
CONFIG_RGB_PRO_MATRIX_COLS=14

CONFIG_RGB_PRO_START_ON=y
CONFIG_RGB_PRO_BRT_START=40

# Surprise me: new random effect (and colour) after every idle wake
CONFIG_RGB_PRO_RANDOM_ON_WAKE=y
CONFIG_RGB_PRO_SPEED_START=2

# --- Overlays (key positions are in keymap order) ---

# Caps lock: CAPS key is position 42. Green, 1s blink.
CONFIG_RGB_PRO_CAPS_INDICATOR=y
CONFIG_RGB_PRO_CAPS_KEY=42
CONFIG_RGB_PRO_CAPS_R=157
CONFIG_RGB_PRO_CAPS_G=0
CONFIG_RGB_PRO_CAPS_B=255
CONFIG_RGB_PRO_CAPS_BLINK_MS=750

# Output / BT profile status on the LOWER layer.
#   position 14 = OUT_TOG, positions 15-19 = BT_SEL 0-4
CONFIG_RGB_PRO_STATUS_OVERLAY=y
CONFIG_RGB_PRO_STATUS_LAYER=1
CONFIG_RGB_PRO_STATUS_OUT_KEY=14
CONFIG_RGB_PRO_STATUS_BT_KEY_BASE=15
CONFIG_RGB_PRO_STATUS_BT_COUNT=5
CONFIG_RGB_PRO_STATUS_BLINK_MS=600

# Battery bar on the LOWER layer across ESC F1 F2 F3 (positions 0-3).
CONFIG_RGB_PRO_BATTERY_INDICATOR=y
CONFIG_RGB_PRO_BATTERY_LAYER=1
CONFIG_RGB_PRO_BATTERY_KEY_START=0
CONFIG_RGB_PRO_BATTERY_KEY_COUNT=10
CONFIG_RGB_PRO_BATTERY_RED_BELOW=15

CONFIG_LED_STRIP=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y
CONFIG_ZMK_HID_INDICATORS=y

# --- ZMK Studio (live keymap editing over USB) ---
#CONFIG_ZMK_STUDIO=y

# --- Bluetooth ---
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Power ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=30000000
CONFIG_ZMK_EXT_POWER=y

# --- Debug (uncomment to enable USB serial logging) ---
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
