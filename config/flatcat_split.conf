# =============================================================================
# FlatCat Split — shared by both halves
# =============================================================================

# --- Per-key RGB (zmk-pro-rgb) ---
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_RGB_PRO=y

# Each half drives its own 79-LED strip.
CONFIG_RGB_PRO_NUM_KEYS=79

# Geometry describes the WHOLE keyboard, so effects sweep across both halves.
CONFIG_RGB_PRO_MATRIX_ROWS=6
CONFIG_RGB_PRO_MATRIX_COLS=28

CONFIG_RGB_PRO_START_ON=y
CONFIG_RGB_PRO_BRT_START=40

# Random-on-wake is unavailable on splits: each half idles independently.

CONFIG_LED_STRIP=y
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# --- Split link ---
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_BLE=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_ZMK_BLE=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Power ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000
CONFIG_ZMK_EXT_POWER=y
